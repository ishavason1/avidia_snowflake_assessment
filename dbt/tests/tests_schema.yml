version: 2

tests:
  - name: test_mart_deposits_completeness
    description: "COMPLETENESS: return each MART_DEPOSITS record whose ACCOUNT_ID is NULL."
    config:
      tags: ["quality", "mart_deposits"]
      meta:
        assessment: deposits
        check_dimension: COMPLETENESS
        target_column: ACCOUNT_ID
        failure_unit: MART_ROW

  - name: test_mart_deposits_uniqueness
    description: "UNIQUENESS: ACCOUNT_ID must occur once; return one row per duplicated key with its occurrence count."
    config:
      tags: ["quality", "mart_deposits"]
      meta:
        assessment: deposits
        check_dimension: UNIQUENESS
        target_column: ACCOUNT_ID
        failure_unit: DUPLICATED_KEY

  - name: test_mart_deposits_validity
    description: "VALIDITY: PERSON TAX_ID must match ^[0-9]{3}-[0-9]{2}-[0-9]{4}$; BUSINESS must match ^[0-9]{2}-[0-9]{7}$. Reject NULL TAX_ID and NULL/unsupported CUSTOMER_TYPE. Evidence excludes raw TAX_ID."
    config:
      tags: ["quality", "mart_deposits"]
      meta:
        assessment: deposits
        check_dimension: VALIDITY
        target_column: TAX_ID,CUSTOMER_TYPE
        failure_unit: MART_ROW

  - name: test_mart_deposits_consistency
    description: "CONSISTENCY: every MART_DEPOSITS.CUSTOMER_ID must resolve to STG_CUSTOMER; return unmatched account/customer identifiers."
    config:
      tags: ["quality", "mart_deposits"]
      meta:
        assessment: deposits
        check_dimension: CONSISTENCY
        target_column: CUSTOMER_ID
        failure_unit: MART_ROW

  - name: test_mart_deposits_timeliness
    description: "TIMELINESS: dataset MAX(LATEST_BUSINESS_DATE) must equal MAX(STG_TRANSACTION.BUSINESS_DATE) joined independently to ACTIVE CHECKING/SAVINGS STG_ACCOUNT. Fail an empty mart, either NULL watermark, or unequal watermarks. Individual accounts need not transact."
    config:
      tags: ["quality", "mart_deposits"]
      meta:
        assessment: deposits
        check_dimension: TIMELINESS
        target_column: LATEST_BUSINESS_DATE
        failure_unit: DATASET_COMPARISON

  - name: test_mart_deposits_accuracy
    description: "ACCURACY: require one common non-null GL AS_OF_DATE and exactly one non-null control per eligible ACTIVE CHECKING/SAVINGS account type. Reject missing/unexpected mart or GL groups, duplicate/null controls and NULL mart balances. Mart count must equal RECORD_COUNT and ABS(SUM(CURRENT_BALANCE)-CONTROL_TOTAL) must be <= 1.00."
    config:
      tags: ["quality", "mart_deposits"]
      meta:
        assessment: deposits
        check_dimension: ACCURACY
        target_column: CURRENT_BALANCE,ACCOUNT_TYPE
        failure_unit: RECONCILIATION_ISSUE

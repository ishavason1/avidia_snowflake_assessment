name: 'avidia_snowflake'
version: '1.0.0'
config-version: 2

profile: 'avidia'

model-paths: ["dbt/models"]
test-paths: ["dbt/tests"]
analysis-paths: ["dbt/analysis"]
seed-paths: ["dbt/data"]
macro-paths: ["dbt/macros"]
snapshot-paths: ["dbt/snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  avidia_snowflake:
    staging:
      +database: "{{ env_var('DBT_STAGING_DATABASE', 'ANALYTICS') }}"
      +schema: "{{ env_var('DBT_STAGING_SCHEMA', 'STAGING') }}"
      +materialized: table

    marts:
      +database: "{{ env_var('DBT_MARTS_DATABASE', 'ANALYTICS') }}"
      +schema: "{{ env_var('DBT_MARTS_SCHEMA', 'MARTS') }}"
      +materialized: table

tests:
  +store_failures: true
  +database: "{{ env_var('DBT_GOVERNANCE_DATABASE', 'GOVERNANCE') }}"
  +schema: "{{ env_var('DBT_GOVERNANCE_SCHEMA', 'CATALOG') }}"

# Only the explicitly opted-in DQ test invocation writes measured run results.
on-run-end:
  - "{{ populate_dq_result_from_tests(results) }}"

vars:
  environment: "dev"
  snowflake_account: "us94895.central-india.azure"
  snowflake_warehouse: "TRANSFORM_WH"
  source_database: "RAW"
  source_schema: "PUBLIC"
